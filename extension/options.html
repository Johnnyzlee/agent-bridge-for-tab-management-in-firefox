<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Management Agent Bridge for Firefox</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Tab Management Agent Bridge for Firefox</h1>
      <p>The extension obtains its bridge configuration automatically from the local component — no manual token entry or syncing.</p>

      <section>
        <h2>Connection status</h2>
        <dl>
          <div><dt>Auto configuration</dt><dd id="auto-config">Reading…</dd></div>
          <div><dt>MCP Server connection</dt><dd id="state">Reading…</dd></div>
          <div><dt>Local port</dt><dd id="port">—</dd></div>
          <div><dt>Last error</dt><dd id="error">—</dd></div>
        </dl>
        <div class="buttons">
          <button type="button" id="reconnect">Reconnect</button>
          <button type="button" id="redetect">Repair / re-detect local install</button>
        </div>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
