<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Management Agent Bridge for Firefox</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Tab Management Agent Bridge for Firefox</h1>
      <p>扩展会自动从本机安装的桥接组件获取配置，不需要手动输入或同步令牌。</p>

      <section>
        <h2>连接状态</h2>
        <dl>
          <div><dt>自动配置</dt><dd id="auto-config">读取中……</dd></div>
          <div><dt>MCP Server 连接</dt><dd id="state">读取中……</dd></div>
          <div><dt>本地端口</dt><dd id="port">—</dd></div>
          <div><dt>最近错误</dt><dd id="error">—</dd></div>
        </dl>
        <div class="buttons">
          <button type="button" id="reconnect">重新连接</button>
          <button type="button" id="redetect">修复 / 重新检测本地安装</button>
        </div>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
